<html lang="en">
    <head>
        <script type="text/javascript" src="../scripts/libs/jquery.min.js"></script>
        <script type="text/javascript" src="../scripts/libs/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="../styles/bootstrap.min.css" />
        <link rel="stylesheet" href="../styles/styles.css" />
    </head>
    <body>
        <main class="ms-3 me-3">
            <div class="row mt-3 mb-3">
                <div class="col-4">
                    <input class="form-control" type="text" placeholder="Filter..." id="results-viewer-filter" />
                </div>
            </div>
            <div class="table-responsive position-relative sticky-header table-full-screen table-cells-max-width table-cells-min-width">
                <table class="table table-bordered table-striped table-hover" id="results-viewer-table">
                    <thead class="table-header sticky-top"></thead>
                    <tbody></tbody>
                </table>
            </div>
            <p class="results-count-label mt-2">
                <small><span id="results-count-text"></span> <span id="results-count-filtered-text"></span></small>
            </p>
        </main>
    </body>
</html>

<script type="text/javascript" src="../scripts/extension/extension-results-viewer.js"></script>
